name: Deploy staging Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgefoss-staging-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Staging deployment is restricted to refs/heads/main." >&2
            exit 1
          fi
      - name: Require the U3 credentials
        env:
          EDGEFOSS_API_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          EDGEFOSS_ACCOUNT_ID_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$EDGEFOSS_API_TOKEN_CONFIGURED" != "true" ] || [ "$EDGEFOSS_ACCOUNT_ID_CONFIGURED" != "true" ]; then
            echo "U3 is incomplete: configure the two required GitHub Actions secrets." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run project checks
        run: pnpm check
      - name: Verify the staging deployment bundle
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/edgefoss-worker-staging-dry-run"
      - name: Deploy the staging Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --env staging
          packageManager: pnpm
          wranglerVersion: 4.125.0
      - name: Verify stateful staging health
        run: node tools/audit-worker-health.mjs --origin https://edgefoss-staging.miga-and-raia.workers.dev
      - name: Verify anonymous public sync HELLO
        run: node tools/audit-worker-public-sync.mjs --origin https://edgefoss-staging.miga-and-raia.workers.dev
