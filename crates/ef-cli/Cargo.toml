[package]
name = "ef-cli"
description = "Local command-line interface for EdgeFossil"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ef"
path = "src/main.rs"

[dependencies]
edgefoss-core = { path = "../edgefoss-core" }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
ef-format = { path = "../ef-format" }
ef-store-sqlite = { path = "../ef-store-sqlite" }
getrandom = "0.4.3"
zeroize = "1.9"

[lints]
workspace = true
