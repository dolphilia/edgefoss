[package]
name = "ef-testkit"
description = "Synthetic fixtures and reproducible local baselines for EdgeFossil"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ef-local-baseline"
path = "src/main.rs"

[dependencies]
edgefoss-core = { path = "../edgefoss-core" }
ed25519-dalek = "2.2"
ef-format = { path = "../ef-format" }
ef-store-sqlite = { path = "../ef-store-sqlite" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
